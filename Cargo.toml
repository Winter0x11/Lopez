[package]
name = "lopez"
version = "0.2.0"
edition = "2021"
description = "Lopez — terminal-based ISO flasher for Linux (dd-powered)"
license = "MIT"
repository = "https://github.com/kaleab49/Lopez"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
